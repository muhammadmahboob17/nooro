<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Customer Service</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<style>
:root{
  --bg:#08160e; --card:#0f2a1c; --card2:#0b2014; --black:#04100a;
  --gold:#d4af37; --gold2:#f5d76e; --white:#f6f6f6; --muted:#9db3a5;
  --green:#16a34a; --red:#dc2626; --amber:#f59e0b;
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:inherit}
.hidden{display:none !important}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:96px;position:relative;overflow-x:hidden}
@media(min-width:900px){.app{max-width:1100px;padding-bottom:0}}
.header{background:linear-gradient(135deg,#04100a 0%,#0f2a1c 100%);padding:16px 18px;border-bottom:1px solid rgba(212,175,55,.18);position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px}
.header .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);display:flex;align-items:center;justify-content:center;color:#04100a;font-size:20px;box-shadow:0 4px 14px rgba(212,175,55,.35)}
.header h1{font-size:16px;letter-spacing:1px;color:var(--gold)}
.header .sub{font-size:11px;color:var(--muted);margin-top:2px}
.header .logout{margin-left:auto;color:var(--muted);font-size:18px;padding:8px;background:none;border:none;cursor:pointer}
.card{background:var(--card);border:1px solid rgba(212,175,55,.15);border-radius:var(--radius);padding:18px;margin:14px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.card.black{background:var(--black);}
.card h2{font-size:16px;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:14px;color:var(--gold2);margin-bottom:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.4px}
.input-wrap{position:relative;display:flex;align-items:center}
.input,select.input,textarea.input{width:100%;background:var(--card2);border:1px solid rgba(212,175,55,.22);border-radius:14px;padding:14px;color:var(--white);font-size:15px;outline:none;transition:border .2s, box-shadow .2s}
.input:focus,select.input:focus,textarea.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.12)}
.input::placeholder{color:#557a68}
.input-wrap .eye{position:absolute;right:12px;color:var(--muted);padding:8px;cursor:pointer}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .08s, box-shadow .2s;letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn-gold{background:linear-gradient(135deg,var(--gold) 0%,var(--gold2) 100%);color:#04100a;box-shadow:0 6px 18px rgba(212,175,55,.3)}
.btn-ghost{background:transparent;border:1px solid rgba(212,175,55,.4);color:var(--gold)}
.btn-red{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-sm{padding:10px 14px;font-size:13px;width:auto}
.btn-row{display:flex;gap:10px}
.plan-grid{display:grid;gap:12px}
@media(min-width:600px){.plan-grid{grid-template-columns:repeat(3,1fr)}}
.plan{background:var(--card2);border:2px solid rgba(212,175,55,.18);border-radius:18px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.plan.active{border-color:var(--gold);background:linear-gradient(135deg,rgba(212,175,55,.12),rgba(212,175,55,.02));box-shadow:0 8px 24px rgba(212,175,55,.15)}
.plan .days{font-size:22px;font-weight:700;color:var(--gold);margin-bottom:4px}
.plan .price{font-size:13px;color:var(--muted)}
.plan .total{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(212,175,55,.25);font-size:14px;font-weight:600;color:var(--gold2)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600}
.badge.green{background:rgba(22,163,74,.18);color:#4ade80}
.badge.red{background:rgba(220,38,38,.18);color:#f87171}
.badge.amber{background:rgba(245,158,11,.18);color:#fbbf24}
.badge.gray{background:rgba(148,163,184,.15);color:#94a3b8}
.acct{background:var(--card2);border:1px solid rgba(212,175,55,.15);border-radius:16px;padding:14px;margin-bottom:12px}
.acct h4{font-size:13px;color:var(--gold2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:linear-gradient(180deg,#04100a 0%,#0a1f14 100%);border-top:1px solid rgba(212,175,55,.2);display:flex;justify-content:space-around;padding:10px 0 14px;max-width:480px;margin:0 auto}
@media(min-width:900px){.bottom-nav{display:none}}
.nav-item{flex:1;text-align:center;color:var(--muted);font-size:10px;cursor:pointer;padding:4px;transition:color .2s}
.nav-item i{display:block;font-size:18px;margin-bottom:3px}
.nav-item.active{color:var(--gold)}
.tabs{display:flex;overflow-x:auto;gap:8px;padding:12px 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--card2);border:1px solid rgba(212,175,55,.18);color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#04100a;border-color:var(--gold);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px}
.stat{background:var(--card);border:1px solid rgba(212,175,55,.15);border-radius:16px;padding:14px}
.stat .n{font-size:26px;font-weight:700;color:var(--gold)}
.stat .l{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:.4px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-120%);background:var(--card);border:1px solid var(--gold);color:var(--white);padding:12px 18px;border-radius:14px;font-size:13px;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.copy{background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.3);color:var(--gold);padding:8px 14px;border-radius:10px;font-size:12px;cursor:pointer}
.upload{border:2px dashed rgba(212,175,55,.35);border-radius:14px;padding:22px;text-align:center;cursor:pointer;background:var(--card2);transition:all .2s}
.upload.has{border-style:solid;border-color:var(--green);background:rgba(22,163,74,.08)}
.upload i{font-size:26px;color:var(--gold);margin-bottom:8px;display:block}
.upload .hint{color:var(--muted);font-size:12px;margin-top:4px}
.divider{height:1px;background:rgba(212,175,55,.15);margin:14px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px}
.row .k{color:var(--muted)}
.row .v{color:var(--white);font-weight:600;text-align:right;max-width:60%}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty i{font-size:40px;margin-bottom:12px;opacity:.4;display:block}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9998;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.modal-box h2{color:#f87171;margin-bottom:12px;font-size:16px;display:flex;align-items:center;gap:8px}
.reason-opt{display:flex;gap:10px;align-items:flex-start;padding:12px;background:var(--card2);border:1px solid rgba(212,175,55,.15);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:13px}
.reason-opt:hover{border-color:var(--gold)}
.reason-opt input{margin-top:3px}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div class="app" id="app"></div>
<div class="bottom-nav hidden" id="bottomNav"></div>

<script>
/* =========================================================
   LOCAL DATABASE (localStorage with quota handling)
========================================================= */
const DB = {
  get(k, def){ try{ return JSON.parse(localStorage.getItem(k)) ?? def }catch{ return def } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  customers: () => DB.get("cs_customers", []),
  saveCustomers: v => { if(!DB.set("cs_customers", v)) toast("⚠️ Storage full!"); },
  payments: () => DB.get("cs_payments", []),
  savePayments: v => { if(!DB.set("cs_payments", v)) toast("⚠️ Storage full! Purana data clear karein."); },
  attendance: () => DB.get("cs_attendance", []),
  saveAttendance: v => { DB.set("cs_attendance", v); },
  admins: () => DB.get("cs_admins", [{ username:"admin", password:"12341234a2" }]),
  session: () => DB.get("cs_session", null),
  saveSession: v => DB.set("cs_session", v),
  clearSession: () => localStorage.removeItem("cs_session"),
  meta: () => DB.get("cs_meta", { nextCustomerId: 1, nextPlanId: 1, nextPaymentId: 1, nextNumberId: 1 }),
  saveMeta: v => DB.set("cs_meta", v),
};

const PLANS = {
  "1_DAY":  { days: 1,  price: 10,  label: "1 Day Plan"  },
  "7_DAY":  { days: 7,  price: 50,  label: "7 Day Plan"  },
  "15_DAY": { days: 15, price: 100, label: "15 Day Plan" },
};

const EASYPAISA = { owner: "Noor Muhammad", number: "03428182981" };

const $ = sel => document.querySelector(sel);
const app = () => $("#app");
const toast = (msg, ms=2800) => {
  const t = $("#toast"); if(!t) return;
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove("show"), ms);
};
const fmt = n => "Rs. " + Number(n).toLocaleString();
const today = () => new Date().toISOString().slice(0,10);
const nowISO = () => new Date().toISOString();
const dateAdd = (dateStr, days) => {
  const d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0,10);
};
const daysLeft = (expiry) => {
  if (!expiry) return 0;
  const ms = new Date(expiry + "T23:59:59Z") - new Date();
  return Math.max(0, Math.ceil(ms / 86400000));
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = ()=> Math.random().toString(36).slice(2,10);

/* Force admin password */
(function(){
  const admins = DB.admins();
  const found = admins.find(a => a.username === "admin");
  if (!found || found.password !== "12341234a2"){
    DB.set("cs_admins", [{ username:"admin", password:"12341234a2" }]);
  }
})();

const Routes = {
  "/": "landing", "/register": "register", "/login": "login",
  "/dashboard": "dashboard", "/plan": "plan", "/play": "play",
  "/attendance": "attendance", "/profile": "profile",
  "/admin/login": "adminLogin", "/admin": "adminDashboard",
  "/admin/payments": "adminPayments", "/admin/customers": "adminCustomers",
  "/admin/attendance": "adminAttendance", "/admin/history": "adminHistory",
};

function navigate(path){
  if (location.hash !== "#" + path) history.pushState(null, "", "#" + path);
  render();
}
window.addEventListener("hashchange", render);
window.addEventListener("popstate", render);
function currentPath(){ return (location.hash || "#/").slice(1); }

/* =========================================================
   RENDER — session aware
========================================================= */
function render(){
  const path = currentPath();
  const route = Routes[path] || "notFound";
  const session = DB.session();
  const nav = $("#bottomNav");

  const customerRoutes = ["dashboard","plan","play","attendance","profile"];
  const adminRoutes = ["adminDashboard","adminPayments","adminCustomers","adminAttendance","adminHistory"];
  const authRoutes = ["landing","login","register","adminLogin"];

  if (customerRoutes.includes(route)){
    if (!session || session.role !== "CUSTOMER"){
      if (session && session.role === "ADMIN"){ location.hash = "#/admin"; return; }
      location.hash = "#/login"; return;
    }
  }
  if (adminRoutes.includes(route)){
    if (!session || session.role !== "ADMIN"){
      if (session && session.role === "CUSTOMER"){ location.hash = "#/dashboard"; return; }
      location.hash = "#/admin/login"; return;
    }
  }
  if (session && authRoutes.includes(route)){
    if (session.role === "ADMIN"){ location.hash = "#/admin"; return; }
    if (session.role === "CUSTOMER"){ location.hash = "#/dashboard"; return; }
  }

  const Views = {
    landing, register, login, dashboard, plan, play, attendance, profile,
    adminLogin, adminDashboard, adminPayments, adminCustomers, adminAttendance, adminHistory,
    notFound,
  };
  app().innerHTML = Views[route]();

  const customerNav = ["dashboard","plan","play","attendance","profile"];
  if (customerNav.includes(route)){
    nav.classList.remove("hidden");
    nav.innerHTML = [
      ["dashboard","🏠","Home"], ["plan","📋","Plan"], ["play","🎮","Play"],
      ["attendance","📅","Attendance"], ["profile","👤","Profile"],
    ].map(([r,i,l]) =>
      `<div class="nav-item ${r===route?'active':''}" onclick="navigate('/${r}')">
         <span style="font-size:18px">${i}</span>${l}
       </div>`
    ).join("");
  } else {
    nav.classList.add("hidden");
    nav.innerHTML = "";
  }
  window.scrollTo(0,0);
}

/* =========================================================
   HEADER
========================================================= */
function header(title="CUSTOMER SERVICE", subtitle="Fast • Simple • Secure", showLogout=false){
  return `
  <div class="header">
    <div class="logo"><i class="fa-solid fa-shield-halved"></i></div>
    <div><h1>${title}</h1><div class="sub">${subtitle}</div></div>
    ${showLogout ? `<button class="logout" onclick="doLogout()"><i class="fa-solid fa-right-from-bracket"></i></button>` : ""}
  </div>`;
}

/* =========================================================
   LANDING
========================================================= */
function landing(){
  return `
  ${header()}
  <div class="card" style="margin-top:30px;text-align:center">
    <div style="font-size:56px;margin:10px 0">🛡️</div>
    <h2 style="justify-content:center;font-size:20px">Welcome</h2>
    <p style="color:var(--muted);font-size:13px;margin:8px 0 22px">Manage your plans, payments and daily tasks with ease.</p>
    <button class="btn btn-gold" style="margin-bottom:10px" onclick="navigate('/register')">
      <i class="fa-solid fa-user-plus"></i> Register
    </button>
    <button class="btn btn-ghost" onclick="navigate('/login')">
      <i class="fa-solid fa-right-to-bracket"></i> Customer Login
    </button>
    <div class="divider"></div>
    <button class="btn btn-ghost" onclick="navigate('/admin/login')" style="font-size:12px">
      <i class="fa-solid fa-user-shield"></i> Admin Login
    </button>
  </div>
  <div style="text-align:center;color:var(--muted);font-size:11px;padding:20px">
    Demo build • Data stored locally in your browser
  </div>`;
}

/* =========================================================
   REGISTER
========================================================= */
let regState = null;
function register(){
  regState = regState || { firstName:"", plan:"", numberCount:1, numbers:[{phone:"", pw:""}], slip:null };
  while (regState.numbers.length < regState.numberCount) regState.numbers.push({phone:"",pw:""});
  regState.numbers = regState.numbers.slice(0, regState.numberCount);

  const nums = Array.from({length: regState.numberCount}, (_,i)=>{
    const n = regState.numbers[i];
    return `
    <div class="acct">
      <h4><i class="fa-solid fa-mobile-screen"></i> My Telenor Account ${i+1}</h4>
      <div class="field">
        <label>Mobile Number</label>
        <input class="input mono" inputmode="numeric" maxlength="11" placeholder="03XXXXXXXXX"
          value="${esc(n.phone)}" oninput="regNumChange(${i},'phone',this.value)">
      </div>
      <div class="field" style="margin-bottom:0">
        <label>My Telenor Login Password</label>
        <div class="input-wrap">
          <input class="input" type="password" id="pw-${i}" placeholder="********"
            value="${esc(n.pw)}" oninput="regNumChange(${i},'pw',this.value)">
          <span class="eye" onclick="togglePw(${i})"><i class="fa-solid fa-eye"></i></span>
        </div>
      </div>
    </div>`;
  }).join("");

  const total = regState.plan && PLANS[regState.plan]
    ? PLANS[regState.plan].price * regState.numberCount : 0;

  return `
  ${header()}
  <div class="card">
    <h2><i class="fa-solid fa-user-plus"></i> Register</h2>
    <div class="field">
      <label>First Name</label>
      <input class="input" id="reg-name" placeholder="Your first name"
        value="${esc(regState.firstName)}" oninput="regState.firstName=this.value">
    </div>
    <div class="field">
      <label>Number of Accounts</label>
      <div class="btn-row" style="gap:8px;flex-wrap:wrap">
        ${[1,2,3,4].map(n=>`
          <button class="btn ${regState.numberCount===n?'btn-gold':'btn-ghost'}"
            style="padding:12px;flex:1;min-width:70px"
            onclick="regSetCount(${n})">${n}</button>
        `).join("")}
      </div>
      <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px">
        ${regState.numberCount} Number${regState.numberCount>1?'s':''} selected
      </div>
    </div>
    <div class="divider"></div>
    <h3 style="margin-bottom:10px">My Telenor Accounts</h3>
    <div id="accts">${nums}</div>
    <div class="divider"></div>
    <h3 style="margin-bottom:10px">Select Plan</h3>
    <div class="plan-grid">
      ${Object.entries(PLANS).map(([key,p])=>`
        <div class="plan ${regState.plan===key?'active':''}" onclick="regSetPlan('${key}')">
          <div class="days">${p.days} Day${p.days>1?'s':''}</div>
          <div class="price">Rs. ${p.price} / number</div>
          <div class="total">Total: ${fmt(p.price * regState.numberCount)}</div>
        </div>
      `).join("")}
    </div>
    ${total ? `
    <div class="card black" style="margin:14px 0 0;padding:14px">
      <div class="row"><span class="k">Calculation</span><span class="v">${regState.numberCount} Number${regState.numberCount>1?'s':''} × Rs. ${PLANS[regState.plan].price}</span></div>
      <div class="row" style="border-top:1px solid rgba(212,175,55,.15);padding-top:10px">
        <span class="k">Total Amount</span><span class="v" style="color:var(--gold);font-size:16px">${fmt(total)}</span>
      </div>
    </div>` : ""}
    <div class="divider"></div>
    <button class="btn btn-gold" onclick="submitRegistration()">
      <i class="fa-solid fa-arrow-right"></i> Continue to Payment
    </button>
    <div style="text-align:center;margin-top:12px">
      <a style="color:var(--muted);font-size:12px" href="#/login">Already registered? Login</a>
    </div>
  </div>`;
}
function togglePw(i){
  const el = document.getElementById("pw-"+i);
  el.type = el.type === "password" ? "text" : "password";
}
function regNumChange(i, key, val){
  if (key==="phone") val = val.replace(/\D/g,"").slice(0,11);
  regState.numbers[i][key] = val;
}
function regSetCount(n){
  regState.numberCount = n;
  while (regState.numbers.length < n) regState.numbers.push({phone:"",pw:""});
  regState.numbers = regState.numbers.slice(0, n);
  render();
}
function regSetPlan(p){ regState.plan = p; render(); }

function submitRegistration(){
  const name = regState.firstName.trim();
  if (!name) return toast("Please enter your first name");
  if (!regState.plan) return toast("Please select a plan");
  for (let i=0;i<regState.numberCount;i++){
    const n = regState.numbers[i];
    if (!/^03\d{9}$/.test(n.phone)) return toast(`Account ${i+1}: Enter valid number (03XXXXXXXXX)`);
    if (!n.pw || n.pw.length < 3) return toast(`Account ${i+1}: Enter password`);
  }
  const meta = DB.meta();
  const customerId = meta.nextCustomerId++;
  const customers = DB.customers();

  const numbers = regState.numbers.map(n=>({
    id: "n" + (meta.nextNumberId++),
    phone: n.phone, pw: n.pw, status: "ACTIVE",
  }));

  const plan = {
    id: "p" + (meta.nextPlanId++),
    planName: regState.plan,
    durationDays: PLANS[regState.plan].days,
    pricePerNumber: PLANS[regState.plan].price,
    numberOfAccounts: regState.numberCount,
    totalPrice: PLANS[regState.plan].price * regState.numberCount,
    startDate: null, expiryDate: null, status: "WAITING",
    createdAt: nowISO(),
  };

  const customer = {
    id: "c" + customerId, firstName: name,
    accountCount: regState.numberCount, numbers, plan,
    createdAt: nowISO(),
  };
  customers.push(customer);
  DB.saveCustomers(customers);
  DB.saveMeta(meta);

  regState = { ...regState, createdCustomerId: customer.id, slip: null };
  showPaymentView();
}

/* =========================================================
   PAYMENT VIEW + SLIP UPLOAD (compressed)
========================================================= */
function showPaymentView(){
  const cid = regState.createdCustomerId;
  const customer = DB.customers().find(c=>c.id===cid);
  const plan = customer.plan;

  app().innerHTML = `
  ${header()}
  <div class="card">
    <h2><i class="fa-solid fa-credit-card"></i> Payment</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px">
      Send the total amount to the Easypaisa account below, then upload your transaction slip.
    </p>
    <div class="card black" style="margin:0 0 14px">
      <div style="text-align:center;padding:6px 0">

function compressImage(dataUrl, maxDim, quality, callback){
  const img = new Image();
  img.onload = () => {
    let { width, height } = img;
    if (width > height && width > maxDim){ height = Math.round((height * maxDim) / width); width = maxDim; }
    else if (height > maxDim){ width = Math.round((width * maxDim) / height); height = maxDim; }
    const canvas = document.createElement("canvas");
    canvas.width = width; canvas.height = height;
    canvas.getContext("2d").drawImage(img, 0, 0, width, height);
    callback(canvas.toDataURL("image/jpeg", quality));
  };
  img.onerror = () => callback(dataUrl);
  img.src = dataUrl;
}
function handleSlip(input){
  const f = input.files[0];
  if (!f) return;
  if (f.size > 2*1024*1024) return toast("File too large (max 2 MB). Compress the image.");
  const reader = new FileReader();
  reader.onload = e => {
    const data = e.target.result;
    if (f.type.startsWith("image/")){
      compressImage(data, 700, 0.6, compressed => {
        regState.slip = { name:f.name, data: compressed };
        showPaymentView();
      });
    } else {
      regState.slip = { name:f.name, data };
      showPaymentView();
    }
  };
  reader.readAsDataURL(f);
}

/* Slip viewer modal (no popup blocker issues) */
function viewSlip(id){
  const p = DB.payments().find(x=>x.id===id);
  if (!p) return toast("Payment not found");
  if (!p.slipData) return toast("No slip attached");

  const old = document.getElementById("slipModal");
  if (old) old.remove();

  let content = "";
  if (p.slipData.startsWith("data:image")){
    content = `<img src="${p.slipData}" style="max-width:100%;max-height:70vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.6);display:block;margin:0 auto">`;
  } else if (p.slipData.startsWith("data:application/pdf")){
    content = `<iframe src="${p.slipData}" style="width:100%;height:70vh;border:0;background:#fff;border-radius:12px"></iframe>`;
  } else {
    content = `<div style="color:#fff;font-size:14px;text-align:center;padding:20px">Unsupported file</div>`;
  }

  const modal = document.createElement("div");
  modal.id = "slipModal";
  modal.className = "modal";
  modal.innerHTML = `
    <div class="modal-box" style="border-color:var(--gold)">
      <h2 style="color:var(--gold);font-size:14px;margin-bottom:10px">
        <i class="fa-solid fa-image"></i> ${esc(p.slipName||"Transaction Slip")}
      </h2>
      ${content}
      <button class="btn btn-ghost" style="margin-top:12px" onclick="document.getElementById('slipModal').remove()">
        <i class="fa-solid fa-xmark"></i> Close
      </button>
    </div>`;
  modal.addEventListener("click", e => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}

/* Approve with confirm() — mobile pe chalta hai */
function approvePayment(id){
  const payments = DB.payments();
  const p = payments.find(x=>x.id===id);
  if (!p) return toast("Payment not found");
  const customers = DB.customers();
  const c = customers.find(x=>x.id===p.customerId);
  if (!c) return toast("Customer not found");

  if (!confirm(`Approve ${c.firstName}'s payment of ${fmt(p.amount)}?\n\nPlan will become ACTIVE.`)) return;

  const now = nowISO();
  const start = today();
  const expiry = dateAdd(start, c.plan.durationDays);

  p.status = "APPROVED";
  p.approvedAt = now;
  c.plan.status = "ACTIVE";
  c.plan.startDate = start;
  c.plan.expiryDate = expiry;

  const att = DB.attendance();
  c.numbers.forEach(n=>{
    const exists = att.find(a => a.numberId===n.id && a.date===today());
    if (!exists) att.push({
      id: uid(), customerId: c.id, numberId: n.id, date: today(),
      status: "PENDING", markedAt: null, markedBy: null,
    });
  });

  DB.savePayments(payments);
  DB.saveCustomers(customers);
  DB.saveAttendance(att);
  toast("✅ Approved! Plan is now ACTIVE.");
  render();
}

  const sel = document.querySelector('input[name="rejreason"]:checked');

}

function markAttendance(customerId, numberId){
  const att = DB.attendance();
  const d = today();
  let rec = att.find(a => a.numberId===numberId && a.date===d);
  if (!rec){
    rec = { id: uid(), customerId, numberId, date: d, status: "PRESENT", markedAt: nowISO(), markedBy: DB.session().username };
    att.push(rec);
  } else {
    rec.status = "PRESENT"; rec.markedAt = nowISO(); rec.markedBy = DB.session().username;
  }
  DB.saveAttendance(att);
  toast("Marked as PRESENT ✓");
  render();
}

/* =========================================================
   DAILY MAINTENANCE
========================================================= */
function dailyMaintenance(){
  const last = DB.get("cs_last_maintenance", null);
  const d = today();
  if (last === d) return;
  const customers = DB.customers();
  const now = new Date();
  customers.forEach(c=>{
    if (c.plan.status==="ACTIVE" && c.plan.expiryDate && new Date(c.plan.expiryDate+"T23:59:59Z") < now){
      c.plan.status = "EXPIRED";
    }
  });
  DB.saveCustomers(customers);
  const att = DB.attendance();
  att.forEach(a=>{ if (a.status==="PENDING" && a.date < d){ a.status = "INCOMPLETE"; } });
  customers.forEach(c=>{
    if (c.plan.status==="ACTIVE"){
      c.numbers.forEach(n=>{
        const exists = att.find(a=>a.numberId===n.id && a.date===d);
        if (!exists) att.push({
          id: uid(), customerId: c.id, numberId: n.id, date: d,
          status: "PENDING", markedAt: null, markedBy: null,
        });
      });
    }
  });
  DB.saveAttendance(att);
  DB.set("cs_last_maintenance", d);
}

  if (!hash || hash === "#/" || hash === "#"){
    if (s && s.role === "ADMIN") location.hash = "#/admin";
    else if (s && s.role === "CUSTOMER") location.hash = "#/dashboard";
    else location.hash = "#/";
  }
})();
